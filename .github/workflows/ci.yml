name: SMBC Payment Service CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Display Node Version
        run: node --version

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Tests
        run: npm test

      - name: Build Complete
        run: echo "SMBC Payment Service build completed successfully"
